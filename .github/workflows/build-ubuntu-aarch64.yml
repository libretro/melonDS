name: CMake Build (Ubuntu aarch64)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      shell: bash
      working-directory: ${{github.workspace}}
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev qtbase5-dev libslirp-dev libarchive-dev libepoxy-dev
    - name: Create build environment
      run: mkdir build
    - name: Configure
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: |
          cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
    - name: Make
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: |
        make -j$(nproc --all) \
        && mkdir dist \
        && cp melonDS dist
    - uses: actions/upload-artifact@v7
      with:
        name: melonDS-ubuntu-aarch64
        path: ${{github.workspace}}/build/dist
