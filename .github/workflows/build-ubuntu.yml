name: CMake Build (Ubuntu x86-64)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config libcurl4-gnutls-dev libpcap-dev libsdl2-dev qtbase5-dev libslirp-dev libarchive-dev libepoxy-dev
    - name: Create build environment
      run: mkdir build
    - name: Configure
      working-directory: ${{github.workspace}}/build
      run: cmake "$GITHUB_WORKSPACE"
    - name: Make
      working-directory: ${{github.workspace}}/build
      run: |
        make -j$(nproc --all)
        mkdir dist
        cp melonDS dist
    - uses: actions/upload-artifact@v7
      with:
        name: melonDS-ubuntu-x86_64
        path: ${{github.workspace}}/build/dist
